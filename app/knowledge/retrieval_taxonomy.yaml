    aliases: [未来城, 未来城校区]
  ALL:
    aliases: [全校, 各校区, 所有校区]

facet_terms:
  ELIGIBILITY:
    query_terms: [条件, 资格, 哪些人可以, 哪些学生, 哪些课程, 什么情况, 能否, 可以申请, 是否可以]
    evidence_patterns: [申请条件, 补考条件, 适用对象, 应当符合, 可以申请, 可申请, 可按, 申请人]
  MATERIALS:
    query_terms: [材料, 资料, 证明, 准备什么, 要带什么, 提交什么]
    evidence_patterns: [申请表, 申诉书, 申诉申请书, 决定书的副本, 书面委托代理书, 申请材料, 提交材料, 提供证明, 材料包括, 签字盖章, 附件]
  STEPS:
    query_terms: [流程, 怎么, 怎样, 怎么办, 如何办理, 办理步骤, 怎么申请, 如何申请]
    evidence_patterns: [填写, 提交, 递交, 审核, 审批, 签字盖章, 领取, 申请流程, 办理流程, 安排, 评估, 拆分]
  CHANNEL:
    query_terms: [入口, 在哪里办, 去哪里办, 去哪里, 线上, 线上办理, 服务平台]
    evidence_patterns: [服务中心, 支持中心, 心理中心, 教务部门, 辅导员, 信息门户, 线上办理, 办理入口, 服务平台, 办公室]
  DEADLINE:
    query_terms: [截止, 截止时间, 截止日期, 最晚时间, 申请时间, 什么时候申请, 什么时候交, 申诉期限, 流程、期限, 多久内完成, 有效期, 集中办理]
    evidence_patterns: [截止, 申请时间, 有效期, 申请日期, 集中办理, 每年五月]
  PROCESSING_TIME:
    query_terms: [几个工作日, 多少个工作日, 多久办完, 办理多久, 审批多久, 处理时长, 办结时限, 办理时限]
    evidence_patterns: [个工作日, 工作日内办结, 办理时长, 处理时长, 办结时限]
  CONTACT:
    query_terms: [联系方式, 电话, 联系谁, 联系, 咨询哪里]
    evidence_patterns: [联系电话, 咨询电话, 联系人, 联系方式, 联系导师, 联系辅导员, 辅导员, 导师, 咨询]
  COST:
    query_terms: [多少钱, 费用, 收费, 缴费]
    evidence_patterns: [费用, 收费标准, 缴费, 元]
  SCOPE:
    query_terms: [适用范围, 哪个校区, 哪些学生, 范围]
    evidence_patterns: [适用于, 适用范围, 校区, 本科生, 学生]
  POLICY_BASIS:
    query_terms: [依据, 规定, 政策, 哪一条, 文件]
    evidence_patterns: [根据, 依据, 条例, 办法, 规定, 第]

