name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile app
        run: python -m compileall app tests
      - name: Run tests
        env:
          AI_PROVIDER: mock
          DATABASE_URL: sqlite:///./target/ci-test.sqlite3
          REDIS_URL: redis://127.0.0.1:6379/15
          KNOWLEDGE_VECTOR_ENABLED: "false"
        run: |
          mkdir -p target
          python -m pytest -q

  windows-process-supervisor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest==8.3.5 pytest-asyncio==0.24.0
      - name: Test Windows process cleanup
        run: python -m pytest -q tests/test_turn_execution_supervisor.py
