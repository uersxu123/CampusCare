services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindbridge
      MYSQL_USER: mindbridge
      MYSQL_PASSWORD: mindbridge
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AGENT_FRAMEWORK: ${AGENT_FRAMEWORK:-event_driven_multi_agent}
      AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-12}
      AGENT_MAX_ROUNDS_HARD_LIMIT: ${AGENT_MAX_ROUNDS_HARD_LIMIT:-16}
      AI_PROVIDER: ${DOCKER_AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      CONTEXT_INPUT_MAX_TOKENS: ${CONTEXT_INPUT_MAX_TOKENS:-28672}
      AGENT_MODEL_DEFAULT_PROVIDER: ${DOCKER_AGENT_MODEL_DEFAULT_PROVIDER:-ollama}
      AGENT_MODEL_DEFAULT_MODEL: ${DOCKER_AGENT_MODEL_DEFAULT_MODEL:-qwen3:8b}
      AGENT_MODEL_COORDINATOR_PROVIDER: ${DOCKER_AGENT_MODEL_COORDINATOR_PROVIDER:-ollama}
      AGENT_MODEL_COORDINATOR_MODEL: ${DOCKER_AGENT_MODEL_COORDINATOR_MODEL:-qwen3:8b}
      AGENT_MODEL_UNDERSTANDING_PROVIDER: ${DOCKER_AGENT_MODEL_UNDERSTANDING_PROVIDER:-ollama}
      AGENT_MODEL_UNDERSTANDING_MODEL: ${DOCKER_AGENT_MODEL_UNDERSTANDING_MODEL:-qwen3:8b}
      AGENT_MODEL_SAFETY_PROVIDER: ${DOCKER_AGENT_MODEL_SAFETY_PROVIDER:-ollama}
      AGENT_MODEL_SAFETY_MODEL: ${DOCKER_AGENT_MODEL_SAFETY_MODEL:-qwen3:8b}
      AGENT_MODEL_RESPONSE_PROVIDER: ${DOCKER_AGENT_MODEL_RESPONSE_PROVIDER:-ollama}
      AGENT_MODEL_RESPONSE_MODEL: ${DOCKER_AGENT_MODEL_RESPONSE_MODEL:-qwen3:8b}
      AGENT_MODEL_RESPONSE_TEMPERATURE: ${AGENT_MODEL_RESPONSE_TEMPERATURE:-0.25}
      AGENT_MODEL_RESPONSE_MAX_TOKENS: ${AGENT_MODEL_RESPONSE_MAX_TOKENS:-1536}
      AGENT_MODEL_RESPONSE_THINK: ${AGENT_MODEL_RESPONSE_THINK:-false}
      AGENT_MODEL_SPECIALIST_PROVIDER: ${AGENT_MODEL_SPECIALIST_PROVIDER:-ollama}
      AGENT_MODEL_SPECIALIST_MODEL: ${AGENT_MODEL_SPECIALIST_MODEL:-qwen3:8b}
      AGENT_MODEL_SPECIALIST_TEMPERATURE: ${AGENT_MODEL_SPECIALIST_TEMPERATURE:-0.1}
      AGENT_MODEL_SPECIALIST_MAX_TOKENS: ${AGENT_MODEL_SPECIALIST_MAX_TOKENS:-1024}
      AGENT_MODEL_SPECIALIST_THINK: ${AGENT_MODEL_SPECIALIST_THINK:-false}
      AGENT_LOOP_MAX_MODEL_ROUNDS: ${AGENT_LOOP_MAX_MODEL_ROUNDS:-3}
      AGENT_LOOP_MAX_TOOL_CALLS: ${AGENT_LOOP_MAX_TOOL_CALLS:-4}
      AGENT_LOOP_MAX_RESULT_CHARS: ${AGENT_LOOP_MAX_RESULT_CHARS:-12000}
      AGENT_LOOP_DEADLINE_SECONDS: ${AGENT_LOOP_DEADLINE_SECONDS:-100}
      CHAT_RESPONSE_MAX_CONTINUATIONS: ${CHAT_RESPONSE_MAX_CONTINUATIONS:-1}
      CHAT_RESPONSE_MAX_TOTAL_TOKENS: ${CHAT_RESPONSE_MAX_TOTAL_TOKENS:-3072}
      CHAT_TOOLS_ENABLED: ${CHAT_TOOLS_ENABLED:-true}
      CHAT_TOOLS_STDIO_ARGS: ${CHAT_TOOLS_STDIO_ARGS:--m,app.chat_tools.server}
      CHAT_TOOLS_SCHEMA_CACHE_SECONDS: ${CHAT_TOOLS_SCHEMA_CACHE_SECONDS:-300}
      CHAT_TOOLS_CONNECT_TIMEOUT_SECONDS: ${CHAT_TOOLS_CONNECT_TIMEOUT_SECONDS:-5}
      CHAT_TOOLS_CALL_TIMEOUT_SECONDS: ${CHAT_TOOLS_CALL_TIMEOUT_SECONDS:-15}
      CHAT_TOOLS_CACHE_MAX_ITEMS: ${CHAT_TOOLS_CACHE_MAX_ITEMS:-1000}
      CHAT_TOOLS_CIRCUIT_FAILURE_THRESHOLD: ${CHAT_TOOLS_CIRCUIT_FAILURE_THRESHOLD:-5}
      CHAT_TOOLS_CIRCUIT_RECOVERY_SECONDS: ${CHAT_TOOLS_CIRCUIT_RECOVERY_SECONDS:-60}
      DATABASE_URL: mysql+pymysql://mindbridge:mindbridge@mysql:3306/mindbridge?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      MEMORY_V3_ENABLED: ${MEMORY_V3_ENABLED:-true}
      MEMORY_EPISODIC_ENABLED: ${MEMORY_EPISODIC_ENABLED:-true}
      MEMORY_PROFILE_EXTRACTION_ENABLED: ${MEMORY_PROFILE_EXTRACTION_ENABLED:-true}
      MEMORY_WORKER_ENABLED: ${MEMORY_WORKER_ENABLED:-true}
      MEMORY_CHROMA_MODE: ${MEMORY_CHROMA_MODE:-persistent}
      MEMORY_CHROMA_PATH: /app/data/memory-chroma
      MEMORY_EMBEDDING_PROVIDER: ${MEMORY_EMBEDDING_PROVIDER:-ollama}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-bge-m3:latest}
      MEMORY_EMBEDDING_BASE_URL: ${DOCKER_MEMORY_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      MEMORY_EMBEDDING_VERSION: ${MEMORY_EMBEDDING_VERSION:-bge-m3-v1}
      MEMORY_HISTORY_CANDIDATE_K: ${MEMORY_HISTORY_CANDIDATE_K:-8}
      MEMORY_HISTORY_TOP_K: ${MEMORY_HISTORY_TOP_K:-3}
      MEMORY_HISTORY_MAX_TOKENS: ${MEMORY_HISTORY_MAX_TOKENS:-800}
      MEMORY_WORKING_MAX_TOKENS: ${MEMORY_WORKING_MAX_TOKENS:-2200}
      MEMORY_BASE_MAX_TOKENS: ${MEMORY_BASE_MAX_TOKENS:-4200}
      MEMORY_COMPACTION_MIN_MESSAGES: ${MEMORY_COMPACTION_MIN_MESSAGES:-4}
      MEMORY_COMPACTION_MAX_DELTA_TOKENS: ${MEMORY_COMPACTION_MAX_DELTA_TOKENS:-1500}
      MEMORY_IDLE_FINALIZE_SECONDS: ${MEMORY_IDLE_FINALIZE_SECONDS:-1800}
      MEMORY_PROFILE_MIN_CONFIDENCE: ${MEMORY_PROFILE_MIN_CONFIDENCE:-0.85}
      MEMORY_READ_DEADLINE_MS: ${MEMORY_READ_DEADLINE_MS:-800}
      KNOWLEDGE_VECTOR_ENABLED: ${KNOWLEDGE_VECTOR_ENABLED:-true}
      KNOWLEDGE_VECTOR_REQUIRED: ${KNOWLEDGE_VECTOR_REQUIRED:-false}
      KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-ollama}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-bge-m3:latest}
      KNOWLEDGE_EMBEDDING_BASE_URL: ${DOCKER_KNOWLEDGE_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      SKILL_SCENARIO_ENABLED: ${SKILL_SCENARIO_ENABLED:-true}
      SKILL_RULE_MIN_POINTS: ${SKILL_RULE_MIN_POINTS:-80}
      SKILL_RULE_MIN_MARGIN_POINTS: ${SKILL_RULE_MIN_MARGIN_POINTS:-5}
      SKILL_SEMANTIC_ENABLED: ${SKILL_SEMANTIC_ENABLED:-true}
      SKILL_SEMANTIC_MIN_SIMILARITY: ${SKILL_SEMANTIC_MIN_SIMILARITY:-0.70}
      SKILL_SEMANTIC_MIN_MARGIN: ${SKILL_SEMANTIC_MIN_MARGIN:-0.05}
      SKILL_SEMANTIC_BUDGET_MS: ${SKILL_SEMANTIC_BUDGET_MS:-3000}
      SKILL_EMBEDDING_PROVIDER: ${SKILL_EMBEDDING_PROVIDER:-ollama}
      SKILL_EMBEDDING_MODEL: ${SKILL_EMBEDDING_MODEL:-bge-m3:latest}
      SKILL_EMBEDDING_BASE_URL: ${DOCKER_SKILL_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      SKILL_EMBEDDING_VERSION: ${SKILL_EMBEDDING_VERSION:-v1}
      SKILL_MAX_MATCHES: ${SKILL_MAX_MATCHES:-2}
      SKILL_TOTAL_CHARS: ${SKILL_TOTAL_CHARS:-5000}
      KNOWLEDGE_VECTOR_CANDIDATE_K: ${KNOWLEDGE_VECTOR_CANDIDATE_K:-48}
      KNOWLEDGE_VECTOR_COLLECTION_BASE: ${KNOWLEDGE_VECTOR_COLLECTION_BASE:-mindbridge_knowledge_v3}
      KNOWLEDGE_MIN_EVIDENCE_SCORE: ${KNOWLEDGE_MIN_EVIDENCE_SCORE:-0.45}
      KNOWLEDGE_LEGACY_MARKDOWN_BOOTSTRAP_ENABLED: ${KNOWLEDGE_LEGACY_MARKDOWN_BOOTSTRAP_ENABLED:-false}
      KNOWLEDGE_MAX_EVIDENCE: ${KNOWLEDGE_MAX_EVIDENCE:-12}
      KNOWLEDGE_MAX_EVIDENCE_PER_DOCUMENT: ${KNOWLEDGE_MAX_EVIDENCE_PER_DOCUMENT:-3}
      KNOWLEDGE_SEARCH_TIMEOUT_SECONDS: ${KNOWLEDGE_SEARCH_TIMEOUT_SECONDS:-4}
      KNOWLEDGE_FRESHNESS_MAX_AGE_DAYS: ${KNOWLEDGE_FRESHNESS_MAX_AGE_DAYS:-365}
      RAG_TOOL_ENABLED: ${RAG_TOOL_ENABLED:-true}
      RAG_MODEL_PROVIDER: ${RAG_MODEL_PROVIDER:-ollama}
      RAG_MODEL: ${RAG_MODEL:-qwen3:8b}
      RAG_MODEL_MAX_TOKENS: ${RAG_MODEL_MAX_TOKENS:-1024}
      RAG_MODEL_THINK: ${RAG_MODEL_THINK:-false}
      RAG_RERANK_TEMPERATURE: ${RAG_RERANK_TEMPERATURE:-0.0}
      RAG_GRADE_TEMPERATURE: ${RAG_GRADE_TEMPERATURE:-0.0}
      RAG_REWRITE_TEMPERATURE: ${RAG_REWRITE_TEMPERATURE:-0.1}
      RAG_MAX_RETRIEVAL_ROUNDS: ${RAG_MAX_RETRIEVAL_ROUNDS:-2}
      RAG_MAX_REWRITES: ${RAG_MAX_REWRITES:-1}
      RAG_RETRIEVAL_TIMEOUT_SECONDS: ${RAG_RETRIEVAL_TIMEOUT_SECONDS:-8}
      RAG_RERANK_TIMEOUT_SECONDS: ${RAG_RERANK_TIMEOUT_SECONDS:-8}
      RAG_GRADE_TIMEOUT_SECONDS: ${RAG_GRADE_TIMEOUT_SECONDS:-8}
      RAG_REWRITE_TIMEOUT_SECONDS: ${RAG_REWRITE_TIMEOUT_SECONDS:-6}
      RAG_PIPELINE_DEADLINE_SECONDS: ${RAG_PIPELINE_DEADLINE_SECONDS:-60}
      RAG_TOOL_CALL_TIMEOUT_SECONDS: ${RAG_TOOL_CALL_TIMEOUT_SECONDS:-65}
      RAG_PER_LIST_CANDIDATE_K: ${RAG_PER_LIST_CANDIDATE_K:-40}
      RAG_FUSED_CANDIDATE_LIMIT: ${RAG_FUSED_CANDIDATE_LIMIT:-24}
      RAG_GRADE_EVIDENCE_LIMIT: ${RAG_GRADE_EVIDENCE_LIMIT:-8}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-300}
      RAG_FINAL_TOP_K: ${RAG_FINAL_TOP_K:-5}
      WEATHER_TOOL_ENABLED: ${WEATHER_TOOL_ENABLED:-true}
      WEATHER_GEOCODING_BASE_URL: ${WEATHER_GEOCODING_BASE_URL:-https://geocoding-api.open-meteo.com/v1/search}
      WEATHER_FORECAST_BASE_URL: ${WEATHER_FORECAST_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      WEATHER_HTTP_TIMEOUT_SECONDS: ${WEATHER_HTTP_TIMEOUT_SECONDS:-5}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-120}
      RISK_MCP_CALL_TIMEOUT_SECONDS: ${RISK_MCP_CALL_TIMEOUT_SECONDS:-15}
      RISK_MCP_CIRCUIT_FAILURE_THRESHOLD: ${RISK_MCP_CIRCUIT_FAILURE_THRESHOLD:-5}
      RISK_MCP_CIRCUIT_RECOVERY_SECONDS: ${RISK_MCP_CIRCUIT_RECOVERY_SECONDS:-60}
      CHROMA_PERSIST_DIR: /app/data/chroma
      CHROMA_SNAPSHOT_DIR: /app/data/chroma-snapshots
      TOOL_QUEUE_ENABLED: ${TOOL_QUEUE_ENABLED:-true}
      TOOL_QUEUE_EXCEL_WORKERS: ${TOOL_QUEUE_EXCEL_WORKERS:-1}
      TOOL_QUEUE_EMAIL_WORKERS: ${TOOL_QUEUE_EMAIL_WORKERS:-2}
      ALERT_EMAIL_DELIVERY_MODE: ${ALERT_EMAIL_DELIVERY_MODE:-log}
      ALERT_EMAIL_RATE_LIMIT_PER_MINUTE: ${ALERT_EMAIL_RATE_LIMIT_PER_MINUTE:-30}
      EXCEL_PATH: /app/data/mindbridge-risk-ledger.xlsx
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

volumes:
  mysql-data:
  redis-data:
